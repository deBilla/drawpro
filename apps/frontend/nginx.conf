server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy REST API — browser sends to /api/*, nginx forwards to api container
  location /api/ {
    # Match the API's own express.json limit. nginx defaults to 1MB, so without
    # this a large sheet is rejected at the proxy with a 413 that never reaches
    # the API and never appears in its logs.
    client_max_body_size 10m;
    proxy_pass         http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Proxy collab WebSocket — disabled with the collab service (future phase).
  # nginx resolves `proxy_pass` hostnames at startup, so leaving this active
  # while the collab container is absent fails the boot with:
  #   [emerg] host not found in upstream "collab"
  # Re-enable together with `docker compose --profile collab up`.
  # location /collab/ {
  #   proxy_pass          http://collab:3002/;
  #   proxy_http_version  1.1;
  #   proxy_set_header    Upgrade    $http_upgrade;
  #   proxy_set_header    Connection "upgrade";
  #   proxy_set_header    Host       $host;
  #   proxy_read_timeout  86400s;
  # }

  # React SPA — all other paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
