services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawpro
      POSTGRES_DB: drawpro
      # Only read on first init; the volume below is already initialised, so this
      # is a no-op today. The API gets the real credential via DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawpro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drawpro -d drawpro']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api-ts/Dockerfile
    restart: unless-stopped
    env_file: ../apps/api-ts/.env
    environment:
      # DATABASE_URL, JWT secrets come from apps/api-ts/.env (see env_file above).
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      FRONTEND_URL: http://localhost:3010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Real-time collaboration (Yjs). Deferred to a future phase: the frontend has
  # no Yjs client wired up yet, so this server has no clients. Kept defined but
  # off by default — bring it back with:  docker compose --profile collab up
  collab:
    profiles: ['collab']
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    restart: unless-stopped
    env_file: ../apps/collab/.env
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3001
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '3010:80'   # only exposed port
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
