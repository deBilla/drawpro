name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and MCP eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Diagram unit tests
        run: npm run test --workspace @drawpro/diagram

      # The eval spawns the real MCP server and speaks the protocol to it,
      # against a DrawPro API running in the same process. No account, no API
      # key, no network — which is exactly why it can gate every push.
      - name: MCP eval (deterministic)
        run: npm run eval --workspace @drawpro/mcp

      - name: Publish the scorecard as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-eval-results
          path: |
            packages/mcp/eval/results.json
            packages/mcp/eval/SCORECARD.md
