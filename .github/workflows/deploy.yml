name: Deploy to Laptop Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Add SSH config and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          echo "${{ secrets.SSH_CONFIG }}" >> ~/.ssh/config

      - name: Prepare server
        run: |
          ssh ${{ secrets.SERVER_HOST }} '
            if ! sudo swapon --show | grep -q "/swapfile"; then
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab
            fi
            sudo rm -rf ~/drawpro-deployment
            mkdir -p ~/drawpro-deployment
          '

      - name: Copy application files
        run: scp -r . ${{ secrets.SERVER_HOST }}:~/drawpro-deployment/

      - name: Setup environment files
        run: |
          ssh ${{ secrets.SERVER_HOST }} "
            # 1. Copy the example file to create the real .env file
            cp ~/drawpro-deployment/apps/api-ts/.env.example ~/drawpro-deployment/apps/api-ts/.env

            # 2. Safely remove the dummy DATABASE_URL and append the real one from Secrets
            grep -v '^DATABASE_URL=' ~/drawpro-deployment/apps/api-ts/.env > /tmp/api_env.tmp
            printf 'DATABASE_URL=%s\n' '${{ secrets.DATABASE_URL }}' >> /tmp/api_env.tmp
            mv /tmp/api_env.tmp ~/drawpro-deployment/apps/api-ts/.env

            # 2b. Same treatment for the Firebase service account. .env.example
            # ships these blank, and blank means Google sign-in stays disabled,
            # so they have to be replaced rather than merely appended.
            # FIREBASE_PRIVATE_KEY is stored as a single line with literal \n:
            # printf '%s' does not expand those, so the PEM survives the trip
            # and dotenv turns them back into newlines on load.
            grep -v -e '^FIREBASE_PROJECT_ID=' -e '^FIREBASE_CLIENT_EMAIL=' -e '^FIREBASE_PRIVATE_KEY=' \
              ~/drawpro-deployment/apps/api-ts/.env > /tmp/api_env.tmp
            printf 'FIREBASE_PROJECT_ID=%s\n'   '${{ secrets.FIREBASE_PROJECT_ID }}'   >> /tmp/api_env.tmp
            printf 'FIREBASE_CLIENT_EMAIL=%s\n' '${{ secrets.FIREBASE_CLIENT_EMAIL }}' >> /tmp/api_env.tmp
            printf 'FIREBASE_PRIVATE_KEY=\"%s\"\n' '${{ secrets.FIREBASE_PRIVATE_KEY }}' >> /tmp/api_env.tmp
            mv /tmp/api_env.tmp ~/drawpro-deployment/apps/api-ts/.env

            # 3. Handle the collab app (copies example if it exists, otherwise creates empty file)
            if [ -f ~/drawpro-deployment/apps/collab/.env.example ]; then
              cp ~/drawpro-deployment/apps/collab/.env.example ~/drawpro-deployment/apps/collab/.env
            else
              touch ~/drawpro-deployment/apps/collab/.env
            fi
          "

      - name: Build images
        run: |
          ssh ${{ secrets.SERVER_HOST }} '
            cd ~/drawpro-deployment
            # Vite inlines env at build time, so the frontend image needs the
            # Firebase web config here as build args — setting it at runtime is
            # too late. Unset would build a working app with the Google button
            # hidden, which is why these are exported rather than left to
            # compose defaults. All four are public identifiers.
            export VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}"
            export VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
            export VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
            export VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}"
            docker compose -f infra/docker-compose.yml build --no-cache
          '

      - name: Run database migrations
        run: |
          ssh ${{ secrets.SERVER_HOST }} '
            cd ~/drawpro-deployment
            # Postgres must be up before migrating; the API image carries the
            # prisma CLI (a devDependency, and npm ci installs devDeps).
            docker compose -f infra/docker-compose.yml up -d postgres
            docker compose -f infra/docker-compose.yml run --rm --no-deps api npx prisma migrate deploy
          '

      - name: Start services
        run: |
          ssh ${{ secrets.SERVER_HOST }} '
            cd ~/drawpro-deployment
            # No `down` first. `up -d` recreates only the services whose image
            # or config actually changed, so downtime is a container restart
            # rather than the whole stack being stopped for the length of the
            # deploy. `down` also stopped Postgres on every push, which is both
            # unnecessary and the reason users saw 502s mid-deploy.
            # Deliberately not --remove-orphans: if a service ever falls out of
            # this file again, as postgres once had, that flag would delete its
            # container on the next deploy.
            docker compose -f infra/docker-compose.yml up -d
          '

      - name: Verify deployment
        run: |
          ssh ${{ secrets.SERVER_HOST }} '
            cd ~/drawpro-deployment
            docker compose -f infra/docker-compose.yml ps
            docker compose -f infra/docker-compose.yml logs --tail=30
            sudo swapon --show
          '
